<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none">
  <!-- Seamless Hand-Drawn Food & Kitchen Doodle Wallpaper Pattern (Dark Mode) -->
  <g stroke="#a2d0bc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.07">
    <!-- 1. Carrot with leafy greens (Top-Left) -->
    <g transform="translate(35, 30) rotate(-25)">
      <path d="M12 18 C16 12 28 35 24 48 C20 56 16 62 14 68 C12 62 9 55 7 46 C4 35 8 18 12 18 Z" fill="#a2d0bc" fill-opacity="0.04" />
      <path d="M10 32 C13 33 16 31 18 33" />
      <path d="M9 44 C12 45 15 43 17 44" />
      <path d="M11 54 C13 55 15 54 16 55" />
      <!-- Greens -->
      <path d="M12 18 C10 8 4 4 1 2 C4 8 8 14 11 17" />
      <path d="M13 18 C14 7 16 2 18 0 C17 6 15 13 13 17" />
      <path d="M14 18 C19 10 26 7 30 5 C25 10 20 15 15 18" />
    </g>

    <!-- 2. Heirloom Tomato with stem (Top-Center) -->
    <g transform="translate(145, 25)">
      <path d="M18 12 C10 12 4 18 4 27 C4 38 12 44 22 44 C32 44 40 38 40 27 C40 18 34 12 26 12 C22 12 20 14 18 12 Z" fill="#a2d0bc" fill-opacity="0.04" />
      <!-- Stem calyx -->
      <path d="M22 6 L22 13" stroke-width="1.6" />
      <path d="M22 12 C20 8 15 7 14 8 C17 11 20 12 22 12 C24 12 27 11 30 8 C29 7 24 8 22 12" fill="#a2d0bc" fill-opacity="0.06" />
      <path d="M22 12 L22 16" />
      <!-- Crease -->
      <path d="M18 13 C17 18 17 26 19 32" stroke-dasharray="1 3" />
    </g>

    <!-- 3. Sourdough Boule Loaf with score marks (Top-Right) -->
    <g transform="translate(265, 30) rotate(12)">
      <path d="M6 32 C6 18 18 10 32 10 C46 10 58 18 58 32 C58 36 54 40 48 40 L16 40 C10 40 6 36 6 32 Z" fill="#a2d0bc" fill-opacity="0.04" />
      <path d="M12 38 L52 38" />
      <!-- Bread ear scoring -->
      <path d="M18 24 C24 18 38 18 46 25" stroke-width="1.5" />
      <path d="M22 28 C26 24 34 24 40 29" stroke-width="1.2" />
      <circle cx="28" cy="33" r="1" fill="#a2d0bc" fill-opacity="0.2" />
      <circle cx="36" cy="32" r="0.8" fill="#a2d0bc" fill-opacity="0.2" />
      <circle cx="22" cy="34" r="0.8" fill="#a2d0bc" fill-opacity="0.2" />
    </g>

    <!-- 4. Glass Mason Jar / Preserve with lid (Mid-Left) -->
    <g transform="translate(20, 130) rotate(8)">
      <rect x="10" y="6" width="28" height="6" rx="2" fill="#a2d0bc" fill-opacity="0.06" />
      <path d="M12 12 L12 16 C8 18 6 22 6 28 L6 52 C6 56 10 60 16 60 L32 60 C38 60 42 56 42 52 L42 28 C42 22 40 18 36 16 L36 12" fill="#a2d0bc" fill-opacity="0.04" />
      <!-- Label -->
      <rect x="12" y="28" width="24" height="18" rx="2" stroke-dasharray="2 2" />
      <line x1="16" y1="34" x2="32" y2="34" />
      <line x1="18" y1="39" x2="30" y2="39" />
    </g>

    <!-- 5. Fresh Avocado Half with Pit (Center) -->
    <g transform="translate(150, 135) rotate(-15)">
      <path d="M22 6 C14 6 10 14 8 24 C6 35 10 46 22 46 C34 46 38 35 36 24 C34 14 30 6 22 6 Z" fill="#a2d0bc" fill-opacity="0.04" />
      <!-- Inner seed/pit -->
      <circle cx="22" cy="31" r="9" fill="#a2d0bc" fill-opacity="0.08" stroke-width="1.4" />
      <path d="M19 28 A4 4 0 0 1 25 28" opacity="0.4" />
    </g>

    <!-- 6. Wedge of Swiss / Aged Cheese (Mid-Right) -->
    <g transform="translate(275, 140) rotate(-10)">
      <path d="M8 38 L48 38 L48 24 L8 12 Z" fill="#a2d0bc" fill-opacity="0.04" />
      <path d="M8 12 L38 6 L48 24" />
      <!-- Holes -->
      <circle cx="20" cy="26" r="3.5" fill="#0d1410" />
      <circle cx="36" cy="31" r="4" fill="#0d1410" />
      <circle cx="30" cy="18" r="2.5" fill="#0d1410" />
      <circle cx="14" cy="33" r="2" fill="#0d1410" />
    </g>

    <!-- 7. Mushroom / Champignon (Lower-Left) -->
    <g transform="translate(40, 255) rotate(15)">
      <!-- Cap -->
      <path d="M6 26 C6 14 16 6 28 6 C40 6 50 14 50 26 C46 28 38 29 28 29 C18 29 10 28 6 26 Z" fill="#a2d0bc" fill-opacity="0.04" />
      <!-- Stem -->
      <path d="M20 28 C20 38 22 44 24 48 C27 49 29 49 32 48 C34 44 36 38 36 28" fill="#a2d0bc" fill-opacity="0.03" />
      <!-- Spots on cap -->
      <circle cx="22" cy="15" r="2" fill="#a2d0bc" fill-opacity="0.12" />
      <circle cx="34" cy="18" r="2.5" fill="#a2d0bc" fill-opacity="0.12" />
      <circle cx="28" cy="11" r="1.5" fill="#a2d0bc" fill-opacity="0.12" />
    </g>

    <!-- 8. Garlic Bulb with cloves & root (Lower-Center) -->
    <g transform="translate(155, 260) rotate(-8)">
      <path d="M22 6 L22 14 C16 16 10 22 10 30 C10 38 15 44 22 44 C29 44 34 38 34 30 C34 22 28 16 22 14 Z" fill="#a2d0bc" fill-opacity="0.04" />
      <!-- Clove segments -->
      <path d="M22 14 C19 22 16 32 17 42" />
      <path d="M22 14 C25 22 28 32 27 42" />
      <!-- Roots -->
      <path d="M19 44 L17 48" />
      <path d="M22 44 L22 49" />
      <path d="M25 44 L27 48" />
    </g>

    <!-- 9. Fresh Garden Lemon / Citrus Slice (Lower-Right) -->
    <g transform="translate(275, 255) rotate(22)">
      <circle cx="24" cy="24" r="18" fill="#a2d0bc" fill-opacity="0.04" />
      <circle cx="24" cy="24" r="15" stroke-dasharray="1.5 2" />
      <circle cx="24" cy="24" r="2.5" fill="#a2d0bc" fill-opacity="0.15" />
      <!-- Citrus segments -->
      <line x1="24" y1="9" x2="24" y2="21.5" />
      <line x1="24" y1="26.5" x2="24" y2="39" />
      <line x1="9" y1="24" x2="21.5" y2="24" />
      <line x1="26.5" y1="24" x2="39" y2="24" />
      <line x1="13.5" y1="13.5" x2="22" y2="22" />
      <line x1="26" y1="26" x2="34.5" y2="34.5" />
      <line x1="34.5" y1="13.5" x2="26" y2="22" />
      <line x1="22" y1="26" x2="13.5" y2="34.5" />
    </g>

    <!-- 10. Botanical Herbs, Rosemary Sprigs & Starburst Doodles -->
    <!-- Sprig 1 -->
    <g transform="translate(100, 85) rotate(45)">
      <path d="M0 24 Q12 12 24 0" stroke-width="1.2" />
      <path d="M6 18 Q14 16 12 10" />
      <path d="M12 12 Q20 10 18 4" />
      <path d="M8 17 Q2 15 4 9" />
      <path d="M14 11 Q8 9 10 3" />
    </g>

    <!-- Sprig 2 -->
    <g transform="translate(225, 95) rotate(-35)">
      <path d="M0 20 Q10 10 20 0" stroke-width="1.2" />
      <path d="M5 15 Q12 14 11 8" />
      <path d="M11 9 Q18 8 16 3" />
      <path d="M7 14 Q2 12 3 7" />
    </g>

    <!-- Sprig 3 (Lower filler) -->
    <g transform="translate(105, 210) rotate(-20)">
      <path d="M0 22 Q12 14 22 2" stroke-width="1.2" />
      <path d="M6 17 Q14 15 13 9" />
      <path d="M12 11 Q20 9 18 4" />
      <path d="M8 16 Q2 14 4 8" />
    </g>

    <!-- Small Pea Pod / Snow Pea -->
    <g transform="translate(220, 210) rotate(30)">
      <path d="M4 14 C12 6 24 6 32 12 C24 20 12 20 4 14 Z" fill="#a2d0bc" fill-opacity="0.04" />
      <circle cx="12" cy="13" r="2.2" fill="#a2d0bc" fill-opacity="0.15" />
      <circle cx="19" cy="13" r="2.2" fill="#a2d0bc" fill-opacity="0.15" />
      <circle cx="26" cy="13" r="2.2" fill="#a2d0bc" fill-opacity="0.15" />
    </g>

    <!-- Tiny whimsical kitchen sparkles and dots -->
    <path d="M88 40 L90 44 L94 46 L90 48 L88 52 L86 48 L82 46 L86 44 Z" fill="#a2d0bc" fill-opacity="0.15" stroke="none" />
    <path d="M328 100 L329.5 103 L333 104.5 L329.5 106 L328 109 L326.5 106 L323 104.5 L326.5 103 Z" fill="#a2d0bc" fill-opacity="0.15" stroke="none" />
    <path d="M18 220 L19.5 223 L23 224.5 L19.5 226 L18 229 L16.5 226 L13 224.5 L16.5 223 Z" fill="#a2d0bc" fill-opacity="0.15" stroke="none" />
    <path d="M210 325 L211.5 328 L215 329.5 L211.5 331 L210 334 L208.5 331 L205 329.5 L208.5 328 Z" fill="#a2d0bc" fill-opacity="0.15" stroke="none" />

    <!-- Organic dots -->
    <circle cx="70" cy="100" r="1.2" fill="#a2d0bc" fill-opacity="0.2" stroke="none" />
    <circle cx="210" cy="45" r="1.4" fill="#a2d0bc" fill-opacity="0.2" stroke="none" />
    <circle cx="330" cy="195" r="1.2" fill="#a2d0bc" fill-opacity="0.2" stroke="none" />
    <circle cx="130" cy="180" r="1" fill="#a2d0bc" fill-opacity="0.2" stroke="none" />
    <circle cx="85" cy="310" r="1.3" fill="#a2d0bc" fill-opacity="0.2" stroke="none" />
    <circle cx="335" cy="320" r="1.2" fill="#a2d0bc" fill-opacity="0.2" stroke="none" />
    <circle cx="20" cy="340" r="1.1" fill="#a2d0bc" fill-opacity="0.2" stroke="none" />
  </g>
</svg>
